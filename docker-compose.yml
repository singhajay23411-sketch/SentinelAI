version: "3.8"

services:
  # ─────────────────────────────────────────────────────────────
  # MongoDB Database
  # ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: sentinelai_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Python FastAPI Backend Microservice (Scanners & Enterprise)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./playstore-service
      dockerfile: Dockerfile
    container_name: sentinelai_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/SentinelAI
      - DATABASE_NAME=SentinelAI
      - JWT_SECRET_KEY=sentinelai_super_secret_production_key_32_bytes_min
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend-database:/app/database
      - backend-uploads:/app/uploads

  # ─────────────────────────────────────────────────────────────
  # React 19 Frontend Dashboard & Visualizers
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-database:
  backend-uploads:
